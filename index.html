<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="课表">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>课表</title>
<style>
  :root {
    --bg: #fdf3f5; --card: #fffafa; --text: #7d5f55; --muted: #b0948a;
    --line: #f3dee2; --accent: #e89aac; --accent-soft: #fbe7ec;
    --ok: #d97f96; --ok-soft: rgba(217,127,150,.08);
    --warn-bg: #fdf0e4; --warn-text: #b3805a; --warn-line: #f3dcc4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 450px; margin: 0 auto; padding: 10px 10px 40px; }

  /* ---------- 紧凑头部 ---------- */
  header.hd {
    background: linear-gradient(135deg, #f2b8c6, #e89aac);
    color: #fff; border-radius: 12px; padding: 8px 14px 7px;
    box-shadow: 0 4px 14px rgba(232,154,172,.28);
  }
  .hd-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hd-title { font-size: 15px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  /* 比熊小狗头像（纯 CSS） */
  .dog {
    position: relative; flex-shrink: 0; width: 20px; height: 18px; margin-top: 2px;
    background: #fff; border-radius: 48% 48% 46% 46%;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .dog::before {  /* 两只垂耳 */
    content: ''; position: absolute; top: -1px; left: -4px;
    width: 7px; height: 12px; background: #fff; border-radius: 50%;
    box-shadow: 21px 0 0 #fff;
  }
  .dog::after {   /* 两眼 + 鼻子 */
    content: ''; position: absolute; left: 5px; top: 7px;
    width: 2.6px; height: 2.6px; background: #5b4636; border-radius: 50%;
    box-shadow: 7px 0 0 #5b4636, 3.5px 4px 0 .6px #4a382c;
  }
  .hd-badge {
    flex-shrink: 0; padding: 1px 10px; border-radius: 999px;
    background: rgba(255,255,255,.18); font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .hd-row2 {
    margin-top: 3px; font-size: 11.5px; opacity: .9;
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; white-space: nowrap;
  }
  .hd-row2 select {
    background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: 6px; font-size: 11.5px; padding: 1px 4px; font-family: inherit; outline: none;
  }
  .hd-row2 select option { color: #7d5f55; }

  .banner {
    margin: 10px 0 0; padding: 8px 12px; border-radius: 10px; font-size: 12.5px;
    background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line);
  }

  /* ---------- 周课表网格 ---------- */
  .wk-wrap {
    margin-top: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .wk-head {
    display: flex; position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--line);
    border-radius: 12px 12px 0 0;
  }
  .wk-corner { width: 46px; flex-shrink: 0; }
  .wk-col {
    flex: 1; min-width: 56px; text-align: center; padding: 6px 2px 5px;
    font-size: 12.5px; font-weight: 700; border-left: 1px solid var(--line); position: relative;
  }
  .wk-col .d { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  .wk-col.today { background: var(--ok-soft); }
  .wk-col .tag {
    display: inline-block; margin-top: 2px; font-size: 9px; font-weight: 700;
    color: #fff; background: var(--ok); border-radius: 999px; padding: 0 6px; line-height: 1.6;
  }
  .wk-body { position: relative; }
  .h-line { position: absolute; left: 46px; right: 0; border-top: 1px solid var(--line); }
  .h-line.half { border-top: 1px dashed var(--line); opacity: .55; }
  .h-lbl {
    position: absolute; left: 2px; width: 40px; text-align: right;
    font-size: 10px; color: var(--muted); transform: translateY(-6px);
    font-variant-numeric: tabular-nums;
  }
  .v-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
  .col-hl { position: absolute; top: 0; bottom: 0; background: var(--ok-soft); }
  .ev {
    position: absolute; border-radius: 10px; padding: 5px 6px 4px; overflow: hidden; z-index: 1;
    background: var(--evbg, var(--accent-soft));
    border: 1px solid var(--evbd, var(--accent));
  }
  .ev .n {
    font-size: 11.5px; font-weight: 700; line-height: 1.25; color: var(--evtx, var(--text));
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }
  .ev .s { font-size: 10px; color: var(--evtx, var(--muted)); opacity: .75; line-height: 1.45; word-break: break-all; }

  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
  .empty .big { font-size: 30px; margin-bottom: 6px; }

  footer { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 24px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hd" id="head"></header>
  <div class="banner" id="sample-banner" hidden>
    ⚠️ 当前展示的是<b>示例数据</b>（data.js 中标记了 _sample）。请用油猴脚本导出真实课表替换 data.js 后再部署。
  </div>
  <div id="grid"></div>
  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var T = window.TIMETABLE;
  var DAY_CN = ['一', '二', '三', '四', '五', '六', '日'];

  /* ---------------- 基础工具 ---------------- */
  function escHtml(t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function clean(s) {
    return String(s == null ? '' : s).replace(/[\s\u00a0\u00ad\u180e\u2000-\u200f\u2028\u2029\u202f\u205f\u2060-\u206f\u3000\ufe00-\ufe0f\ufeff\ufff9-\ufffb]/g, '');
  }
  function fnv1a(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function parseDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function day0(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function today0() {
    var q = new URLSearchParams(location.search).get('date');   // 调试/测试用：?date=2026-09-14
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) { var d = parseDate(q); if (d) return day0(d); }
    return day0(new Date());
  }
  function fmtMD(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function weekOf(date) {
    var s = parseDate(T.semesterStart); if (!s) return null;
    var utcNoon = function (d) { return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12); };
    return Math.floor((utcNoon(day0(date)) - utcNoon(s)) / 86400000 / 7) + 1;
  }
  function xqjOf(d) { var g = d.getDay(); return g === 0 ? 7 : g; }
  function toMin(hm) { var p = String(hm).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function fmtHM(min) { return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); }
  function fmtWeekRange(week) {
    var s = parseDate(T.semesterStart); if (!s) return '';
    var a = new Date(s); a.setDate(a.getDate() + (week - 1) * 7);
    var b = new Date(a); b.setDate(b.getDate() + 6);
    return fmtMD(a) + ' – ' + fmtMD(b);
  }

  /* ---------------- 与油猴脚本一致的解析 ---------------- */
  function weeksFromZcd(zcd) {
    var s = clean(zcd).replace(/[第周]/g, '');
    var isOdd = /单/.test(s), isEven = /双/.test(s);
    s = s.replace(/[（(]?[单双][)）]?/g, '');
    var weeks = {};
    s.split(/[,，、]/).forEach(function (part) {
      var m = part.match(/^(\d+)\s*(?:[-~－–—至]\s*(\d+))?$/);
      if (!m) return;
      var a = +m[1], b = m[2] ? +m[2] : a;
      for (var w = a; w <= b; w++) weeks[w] = true;
    });
    var arr = Object.keys(weeks).map(Number).sort(function (x, y) { return x - y; });
    if (isOdd) arr = arr.filter(function (w) { return w % 2 === 1; });
    if (isEven) arr = arr.filter(function (w) { return w % 2 === 0; });
    return arr;
  }
  function weeksOf(c) {
    if (Array.isArray(c.weeks) && c.weeks.length) return c.weeks.slice().sort(function (a, b) { return a - b; });
    return weeksFromZcd(c.zcd);
  }
  function parsePeriods(text) {
    var map = {};
    String(text || '').split('\n').forEach(function (line) {
      var m = line.match(/^\s*(\d+)\D+(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/);
      if (m) map[+m[1]] = [m[2], m[3]];
    });
    return map;
  }
  function periodNums(jcs) {
    var nums = clean(jcs).match(/\d+/g) || [];
    return nums.length ? [+nums[0], +nums[nums.length - 1]] : [1, 1];
  }

  /* ---------------- 调色板（按课程名哈希取色，浅底+边框+同色系文字） ---------------- */
  var PALETTE = [
    ['#fbe7ec', '#e89aac', '#b45f74'],  // 粉
    ['#fdeee2', '#eba573', '#b06f3f'],  // 橙
    ['#f0f7e6', '#a8c97a', '#749250'],  // 绿
    ['#e3f4f2', '#74c3ba', '#43857d'],  // 青
    ['#e9eefb', '#93a9e0', '#5f76ad'],  // 蓝
    ['#f3ecfa', '#c0a3de', '#8a68ab'],  // 紫
    ['#fdf3df', '#e6c46f', '#a3843c'],  // 黄
    ['#fae9e4', '#e09583', '#a86351'],  // 珊瑚
    ['#fce8e8', '#e28888', '#b25555'],  // 红
    ['#e8f3fb', '#82b8dd', '#4f82a8'],  // 天蓝
    ['#f0e9fb', '#b394e6', '#7c5cb0'],  // 靛紫
    ['#e6f7f0', '#7fd0ae', '#479a76']   // 薄荷
  ];
  function paletteOf(name) { return PALETTE[fnv1a(String(name)) % PALETTE.length]; }

  /* ---------------- 数据预处理 ---------------- */
  if (!T || !Array.isArray(T.courses)) T = { name: '课表', semesterStart: '', courses: [] };
  var PERIODS = parsePeriods(T.periods);
  T.courses.forEach(function (c) { c._weeks = weeksOf(c); });
  var start = parseDate(T.semesterStart);
  var today = today0();
  var curWeek = start ? weekOf(today) : null;
  var allWeeks = [];
  T.courses.forEach(function (c) { c._weeks.forEach(function (w) { allWeeks.push(w); }); });
  var maxWeek = allWeeks.length ? Math.max.apply(null, allWeeks) : 20;
  var minWeek = allWeeks.length ? Math.min.apply(null, allWeeks) : 1;
  var inTerm = start && curWeek >= minWeek && curWeek <= maxWeek;

  var state = { week: 'current' };
  var qw = new URLSearchParams(location.search).get('week');
  if (qw && /^\d{1,2}$/.test(qw)) state.week = +qw;
  function effWeek() { return state.week === 'current' ? curWeek : state.week; }

  /* ---------------- 渲染 ---------------- */
  function renderHead() {
    var html = '<div class="hd-row1"><span class="hd-title"><span class="dog"></span>' + escHtml(T.name || '课表') + '</span>';
    var badge;
    if (!start) badge = '未配置开学日期';
    else if (curWeek < 1) badge = '假期中 · 还有 ' + (1 - curWeek) + ' 周开学';
    else if (curWeek > maxWeek) badge = '本学期已结束';
    else badge = '第 ' + curWeek + ' 周';
    html += '<span class="hd-badge">' + escHtml(badge) + '</span></div>';

    var parts = [];
    if (inTerm) {
      var tx = xqjOf(today);
      var todays = T.courses.filter(function (c) { return c.xqj === tx && c._weeks.indexOf(curWeek) >= 0; });
      parts.push(todays.length
        ? '今天 ' + fmtMD(today) + ' 周' + DAY_CN[tx - 1] + ' · ' + todays.length + ' 节课'
        : '今天 ' + fmtMD(today) + ' 周' + DAY_CN[tx - 1] + ' · 没课 🎉');
    }
    var w = effWeek();
    if (w && start && w >= minWeek && w <= maxWeek) parts.push(fmtWeekRange(w));
    if (T.updatedAt) parts.push('更新于 ' + escHtml(String(T.updatedAt).slice(5, 16).replace('T', ' ')));
    html += '<div class="hd-row2">' + parts.map(escHtml).join(' · ') +
      ' · 第 <select id="week-select" aria-label="选择周次"></select> 周</div>';
    document.getElementById('head').innerHTML = html;

    var sel = document.getElementById('week-select');
    var opts = '<option value="current">本周' + (curWeek ? '（第 ' + curWeek + ' 周）' : '') + '</option>';
    for (var i = minWeek; i <= maxWeek; i++) opts += '<option value="' + i + '">' + i + '</option>';
    sel.innerHTML = opts;
    sel.value = String(state.week);
    sel.addEventListener('change', function () {
      state.week = this.value === 'current' ? 'current' : +this.value;
      render();
    });
  }

  function buildEvents(week) {
    var out = [];
    T.courses.forEach(function (c) {
      if (c._weeks.indexOf(week) < 0) return;
      var pn = periodNums(c.jcs);
      var a = PERIODS[pn[0]], b = PERIODS[pn[1]] || a;
      if (!a) return;
      out.push({
        c: c, day: c.xqj,
        start: toMin(a[0]), end: toMin(b[1]),
        timeLabel: a[0] + '-' + b[1]
      });
    });
    return out;
  }

  function renderGrid(week) {
    var evs = buildEvents(week);
    if (!evs.length) {
      return '<div class="empty"><div class="big">🎉</div>第 ' + week + ' 周没有课</div>';
    }
    var days = [], daySet = {};
    evs.forEach(function (e) { if (!daySet[e.day]) { daySet[e.day] = 1; days.push(e.day); } });
    days.sort(function (a, b) { return a - b; });
    var n = days.length;

    // 时间轴范围：整点对齐，纵轴每隔一小时一个单位
    var minS = evs[0].start, maxE = evs[0].end;
    evs.forEach(function (e) { if (e.start < minS) minS = e.start; if (e.end > maxE) maxE = e.end; });
    var axisStart = Math.floor(minS / 60) * 60;
    var axisEnd = Math.ceil(maxE / 60) * 60;
    var HOUR_PX = 60;                       // 每小时 60px
    var totalH = (axisEnd - axisStart) / 60 * HOUR_PX;

    // 同一天同一时段重叠的课：并排车道
    days.forEach(function (d) {
      var colEvs = evs.filter(function (e) { return e.day === d; })
        .sort(function (a, b) { return a.start - b.start; });
      var laneEnds = [];
      colEvs.forEach(function (e) {
        var placed = false;
        for (var l = 0; l < laneEnds.length; l++) {
          if (laneEnds[l] <= e.start) { laneEnds[l] = e.end; e._lane = l; placed = true; break; }
        }
        if (!placed) { e._lane = laneEnds.length; laneEnds.push(e.end); }
      });
      colEvs.forEach(function (e) { e._lanes = laneEnds.length; });
    });

    // 表头
    var head = '<div class="wk-head"><div class="wk-corner"></div>';
    days.forEach(function (d) {
      var date = new Date(start);
      date.setDate(date.getDate() + (week - 1) * 7 + (d - 1));
      var isToday = iso(date) === iso(today);
      head += '<div class="wk-col' + (isToday ? ' today' : '') + '">周' + DAY_CN[d - 1] +
        '<span class="d">' + fmtMD(date) + '</span>' +
        (isToday ? '<span class="tag">今天</span>' : '') + '</div>';
    });
    head += '</div>';

    // 每小时横线与标签（整点实线 + 标签，半点虚线）
    var lines = '';
    for (var t = axisStart; t <= axisEnd; t += 60) {
      lines += '<div class="h-line" style="top:' + (t - axisStart) + 'px"></div>';
      if (t < axisEnd) lines += '<div class="h-lbl" style="top:' + (t - axisStart) + 'px">' + fmtHM(t) + '</div>';
    }
    for (var t2 = axisStart + 30; t2 < axisEnd; t2 += 60) {
      lines += '<div class="h-line half" style="top:' + (t2 - axisStart) + 'px"></div>';
    }
    // 列分隔竖线
    for (var vi = 1; vi < n; vi++) {
      lines += '<div class="v-line" style="left:calc(46px + (100% - 46px) * ' + vi + ' / ' + n + ')"></div>';
    }
    // 今天列高亮
    var ti = days.indexOf(xqjOf(today));
    if (ti >= 0) {
      lines += '<div class="col-hl" style="left:calc(46px + (100% - 46px) * ' + ti + ' / ' + n + ');width:calc((100% - 46px) / ' + n + ')"></div>';
    }

    // 课程块
    var blocks = '';
    days.forEach(function (d) {
      var idx = days.indexOf(d);
      var colEvs = evs.filter(function (e) { return e.day === d; })
        .sort(function (a, b) { return a.start - b.start; });
      colEvs.forEach(function (e) {
        var top = (e.start - axisStart) / 60 * HOUR_PX + 1;
        var h = Math.max((e.end - e.start) / 60 * HOUR_PX - 2, 34);
        var k = idx * e._lanes + e._lane;
        var m = n * e._lanes;
        var col = paletteOf(e.c.kcmc);
        var sub = e.c.cdmc ? '<div class="s">' + escHtml(e.c.cdmc) + '</div>' : '';
        blocks += '<div class="ev" style="top:' + top + 'px;height:' + h + 'px;' +
          'left:calc(46px + (100% - 46px) * ' + k + ' / ' + m + ');width:calc((100% - 46px) / ' + m + ');' +
          '--evbg:' + col[0] + ';--evbd:' + col[1] + ';--evtx:' + col[2] + '">' +
          '<div class="n">' + escHtml(e.c.kcmc) + '</div>' + sub + '</div>';
      });
    });

    return '<div class="wk-wrap"><div class="wk" style="min-width:' + (46 + n * 58) + 'px">' +
      head + '<div class="wk-body" style="height:' + totalH + 'px">' + lines + blocks + '</div></div></div>';
  }

  function render() {
    renderHead();
    var w = effWeek();
    var html;
    if (w === null || !start || w < minWeek || w > maxWeek) {
      html = '<div class="empty"><div class="big">🏖️</div>' +
        (start ? '当前不在本学期课表周次内（第 ' + minWeek + ' – ' + maxWeek + ' 周）' : '未配置开学日期（semesterStart）') +
        '<br><span style="font-size:12px">可用上面下拉跳转到任意一周</span></div>';
    } else {
      html = renderGrid(w);
    }
    document.getElementById('grid').innerHTML = html;

    var foot = '数据更新于 ' + escHtml(T.updatedAt ? String(T.updatedAt).slice(0, 16).replace('T', ' ') : '—') +
      ' · 课表更新后重新导出并上传，手机日历会自动同步';
    if (window.location.protocol === 'file:') foot += '<br>（当前从本地文件打开，部署后可通过网址访问）';
    document.getElementById('foot').innerHTML = foot;
  }

  document.title = (T.name || '课表');
  if (T._sample) document.getElementById('sample-banner').hidden = false;
  render();
})();
</script>
</body>
</html>
